<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<link rel="stylesheet" href="figures.css">
<style>
  #fig { width: 1600px; height: 840px; background: radial-gradient(1200px 700px at 85% 30%, #2a2420 0%, var(--night) 60%); color: #f4efe6; }
  .left { position: absolute; left: 84px; top: 92px; width: 700px; }
  .pill { display: inline-block; border: 2px solid var(--accent); color: #ffb487; border-radius: 999px; padding: 8px 18px; font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
  h1 { margin-top: 34px; font-size: 76px; line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; }
  h1 .hl { color: var(--accent); display: block; margin-top: 10px; }
  .sub { margin-top: 30px; font-size: 28px; line-height: 1.4; color: #cfc6b8; font-weight: 500; max-width: 640px; }
  .team { position: absolute; left: 84px; bottom: 64px; font-size: 22px; color: #a89f8c; font-weight: 600; letter-spacing: 0.02em; }
  .team b { color: #f4efe6; }
  .console { position: absolute; left: 1118px; top: 236px; width: 420px; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.08); }
  .console img { display: block; width: 100%; }
  .phone { position: absolute; left: 800px; top: 128px; width: 280px; }
  .tag { position: absolute; font-size: 17px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #a89f8c; }
  .tag.room { left: 806px; top: 92px; }
  .tag.resp { left: 1120px; top: 200px; }
</style>
</head>
<body>
<div id="fig">
  <div class="left">
    <span class="pill">AI BUILDER CUP 2026 · TOP 50</span>
    <h1>It looks like an ordinary order.<span class="hl">It's a call for help.</span></h1>
    <p class="sub">QuickOne: a disguised two-way emergency line built on the Gemini Live API, Firebase and Google Maps Platform.</p>
  </div>
  <div class="team">Team <b>NexMind</b> · Al Ameen N &amp; Jeevan V</div>
  <span class="tag room">What the room sees</span>
  <span class="tag resp">What responders see</span>
  <div class="console"><img src="assets/console-map.png" alt=""></div>
  <div class="phone"><div class="screen"><img src="assets/phone-home-food.png" alt=""></div></div>
</div>
</body>
</html>
