<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 990" width="2400" height="990" role="img" aria-label="QuickBite architecture: the phone app talks to Gemini Live directly and writes every finding to Cloud Firestore, whose realtime listeners update the responder console; Apps Script, open map services and peer-to-peer WebRTC handle recordings, mail, location and live video. No backend server." font-family="Arial, 'Liberation Sans', Helvetica, sans-serif"><defs><marker id="ov-ah-ai-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker><marker id="ov-ah-rs-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E44"/></marker><marker id="ov-ah-wire" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ov-ah-phone-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/></marker></defs><rect x="0" y="0" width="2400" height="990" fill="#FFFFFF"/><text x="24" y="44" font-size="26" font-weight="700" letter-spacing="2" text-anchor="start" fill="#5F6368">CALLER'S PHONE</text><text x="744" y="44" font-size="26" font-weight="700" letter-spacing="2" text-anchor="start" fill="#5F6368">GOOGLE AI · GEMINI API</text><text x="1304" y="44" font-size="26" font-weight="700" letter-spacing="2" text-anchor="start" fill="#5F6368">FIREBASE · REALTIME DATA</text><text x="1944" y="44" font-size="26" font-weight="700" letter-spacing="2" text-anchor="start" fill="#5F6368">RESPONDERS</text><rect x="24" y="64" width="496" height="190" rx="14" fill="#FDEBDF"/><text x="48" y="110" font-size=